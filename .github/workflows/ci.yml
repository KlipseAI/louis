name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      # P3부터 devDependencies가 생긴다. lockfile을 고정해 clean checkout 재현성을 지킨다.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 생성물은 커밋되지만, clean checkout에서 재생성 결과가 같은지 확인한다.
      - name: Build generated artifacts
        run: pnpm build

      - name: Check generated artifact drift
        run: pnpm check

      - name: Prove validation gates
        run: pnpm verify

      # manifest에 등록됐지만 git에 추적되지 않은 파일을 잡는다.
      - name: Check tracked catalog inputs
        run: node scripts/build-design-docs.mjs --check --require-tracked
