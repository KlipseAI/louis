name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      # P3부터 devDependencies가 생긴다. lockfile을 고정해 clean checkout 재현성을 지킨다.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # **브라우저 바이너리는 lockfile에 없다.** DS-D-0005가 실브라우저 러너를 1단계에 뒀으므로
      # `pnpm verify`의 test-harness가 실제로 Chromium을 띄운다. 이 단계가 없으면 로컬에서는
      # 캐시가 있어 통과하고 clean checkout에서만 실패한다 — 2026-08-18의 첫 hosted CI 실행이
      # 정확히 그렇게 실패했다("Executable doesn't exist at .../chrome-headless-shell").
      - name: Install browser binary
        run: pnpm exec playwright install --with-deps chromium

      # 생성물은 커밋되지만, clean checkout에서 재생성 결과가 같은지 확인한다.
      - name: Build generated artifacts
        run: pnpm build

      - name: Check generated artifact drift
        run: pnpm check

      # **`verify` 가 아니라 `verify:ci` 다.** 게이트 24개 중 6개는 제품 저장소
      # (`klipse-web`)를 `git -C` 로 연다. 러너에는 그 저장소가 없다 — 그래서 이 단계가
      # 2026-08-19부터 8회 연속 빨갰다(`verify-citations.mjs:27`). 로컬에는 저장소가 있어
      # 초록이었으므로 여덟 번을 지나도록 안 보였다.
      #
      # 여기서 **돌지 않는** 게이트: verify-gates 의 인용 좌표 카나리아 3개,
      # verify-citations, verify-product-alpha, verify-alpha-consolidation,
      # verify-product-drift, verify-app-nav-labels.
      # 이 여섯은 `pnpm verify:product` 로 제품 저장소가 있는 곳에서만 돈다.
      # **이 CI 가 초록인 것은 전량 통과를 뜻하지 않는다.** 근거 좌표가 제품과 맞는지는
      # 여기서 증명되지 않는다. 배분은 scripts/verify-gate-split.mjs 가 지킨다.
      - name: Prove validation gates (제품 저장소 없이 도는 것만)
        run: pnpm verify:ci

      # manifest에 등록됐지만 git에 추적되지 않은 파일을 잡는다.
      - name: Check tracked catalog inputs
        run: node scripts/build-design-docs.mjs --check --require-tracked

      # **실브라우저 회귀 전량.** `pnpm verify`의 test-harness는 러너가 실패를 전파하는지만
      # 증명하고 suite 자체를 돌리지 않는다. 컴포넌트 acceptance test가 실제로 도는 자리는
      # 여기다 — 로컬에서 두 번 관측된 간헐 실패도 이 단계가 반복 실행으로 드러낼 자리다.
      - name: Run browser regression suite
        run: pnpm test
